
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Member Management</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.4/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.2.4/core.js"></script>

    <style>
        body {
           background-image: url('piano.png');
           background-repeat: no-repeat;
           background-position: center;
           background-size: cover;
           background-attachment: fixed;
           font-family: monospace;
        }

        h3 {
            color: #3f548b;
            font-weight: bold;
            font-size: 200%;
        }

        .container {
            margin-top: 30px;
            padding: 20px;
        }

        input {
            background-color: #e8f0e5 !important;
            margin-top: 15px;
            padding: 10px !important;
        }

        button {
            background-color: #5f5eaf;
            color: white;
            border: none;
            padding: 8px 20px;
            margin-top: 15px;
            border-radius: 5px;
        }

        button:hover {
            background-color: #5878c9;
        }

        #output {
            background-color: #34364e;
            color: white;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            min-height: 200px;
        }

        #output h5 {
            color: #d8e9d2;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h3>Add New Music Club Member:</h3>

        <input type="text" id="first-name"
            class="form-control"
            placeholder="First Name"> <br>

        <input type="text" id="last-name"
            class="form-control"
            placeholder="Last Name"> <br>

        <button id="submit-btn">
            Submit
        </button>

        <div id="output">
            <h5>All Members:</h5>
        </div>

    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
